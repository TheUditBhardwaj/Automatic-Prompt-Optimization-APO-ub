# Config for academic/research schema
model:
  name: "gemini-3.5-flash"
  temperature: 0.0
  max_output_tokens: 16384

dataset:
  raw_dir: "dataset/academic/research/pdf+gold"
  gold_dir: "dataset/academic/research/pdf+gold"
  train_ratio: 0.0
  val_ratio: 0.7
  test_ratio: 0.3
  seed: 42

schema: "research"

optimizer:
  iterations: 3
  mutation_model: "gemini-2.5-flash"
  mutation_temperature: 0.7

output_dir: "output"
